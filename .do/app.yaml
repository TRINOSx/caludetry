# ═══════════════════════════════════════════════════════════
# VOC Mesh Platform — DigitalOcean App Platform Spec
# ═══════════════════════════════════════════════════════════
#
# Web-only deployment (no ML pipeline / edge-agent / GPU)
#
# Architecture:
#   api (FastAPI)       ← Web service, /api/* routes
#   dashboard (React)   ← Static site, serves frontend
#   db (PostgreSQL 16)  ← Managed DO database
#
# NOTE: env_prefix is "VOC_" — all env vars must be prefixed
# ═══════════════════════════════════════════════════════════

name: voc-mesh-platform
region: nyc

services:
  # ── FastAPI Backend ──
  - name: api
    github:
      repo: TRINOSx/caludetry
      branch: main
      deploy_on_push: true
    source_dir: voc-mesh-platform/apps/api
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 5
    routes:
      - path: /api
        preserve_path_prefix: true
      - path: /health
      - path: /docs
      - path: /openapi.json
    envs:
      - key: VOC_DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: VOC_REDIS_URL
        scope: RUN_TIME
        value: "redis://localhost:6379/0"
      - key: VOC_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "CHANGE_ME_MIN_32_CHARS_LONG_SECRET"
      - key: VOC_JWT_EXPIRY
        scope: RUN_TIME
        value: "3600"
      - key: VOC_ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "sk-ant-placeholder"
      - key: VOC_MQTT_BROKER_URL
        scope: RUN_TIME
        value: "mqtt://localhost:1883"
      - key: VOC_CORS_ORIGINS
        scope: RUN_TIME
        value: "*"
      - key: VOC_LOG_LEVEL
        scope: RUN_TIME
        value: "INFO"

  # ── React Dashboard ──
  - name: dashboard
    github:
      repo: TRINOSx/caludetry
      branch: main
      deploy_on_push: true
    source_dir: voc-mesh-platform/apps/dashboard
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: "/api"
      - key: VITE_MQTT_WS_URL
        scope: BUILD_TIME
        value: ""

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-1vcpu-1gb
    num_nodes: 1

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
