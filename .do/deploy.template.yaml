# ═══════════════════════════════════════════════════════════
# DigitalOcean App Platform — Quick Start Guide
# ═══════════════════════════════════════════════════════════
#
# DEPLOYMENT OPTIONS:
#
# Option 1: Full App Spec (recommended)
#   - Uses .do/app.yaml
#   - Deploys all 4 services + managed DB + Redis
#   - DO auto-detects this file
#
# Option 2: doctl CLI
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <app-id> --spec .do/app.yaml
#
# Option 3: Single service (minimal)
#   - Point DO to root Dockerfile
#   - Source dir: voc-mesh-platform/apps/api
#   - Only deploys the API
#
# ═══════════════════════════════════════════════════════════
#
# AFTER DEPLOY — Required Steps:
#
# 1. Set real secrets in DO dashboard → App → Settings → Env:
#    - JWT_SECRET (generate: openssl rand -hex 32)
#    - ANTHROPIC_API_KEY (from console.anthropic.com)
#
# 2. Run DB init script:
#    - Connect to managed DB via DO console
#    - Run: voc-mesh-platform/database/001_init.sql
#    - Or use the db-migrate job (PRE_DEPLOY)
#
# 3. Set up MQTT broker:
#    - DO App Platform doesn't support TCP (MQTT needs 1883)
#    - Options:
#      a) DO Droplet with Mosquitto
#      b) HiveMQ Cloud (free tier)
#      c) EMQX Cloud
#    - Update MQTT_BROKER_URL env var
#
# 4. Update CORS_ORIGINS with your app URL:
#    - e.g., https://voc-mesh-platform-xxxxx.ondigitalocean.app
#
# 5. Update VITE_API_URL for dashboard build:
#    - Same as your app URL
#
# ═══════════════════════════════════════════════════════════
