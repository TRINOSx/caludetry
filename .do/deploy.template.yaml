# ═══════════════════════════════════════════════════════════
# DigitalOcean App Platform — Quick Start
# ═══════════════════════════════════════════════════════════
#
# WEB-ONLY deployment (api + dashboard + managed PostgreSQL)
# ML pipeline and edge-agent are NOT included (no GPU)
#
# DEPLOY:
#   1. Connect repo in DO App Platform
#   2. DO auto-detects .do/app.yaml
#   3. Set real secrets in Settings → Env:
#      - VOC_JWT_SECRET (openssl rand -hex 32)
#      - VOC_ANTHROPIC_API_KEY
#   4. Run DB init: voc-mesh-platform/database/001_init.sql
#   5. Update VOC_CORS_ORIGINS with your app URL
#
# IMPORTANT: all env vars use prefix "VOC_"
#   e.g. VOC_DATABASE_URL, VOC_JWT_SECRET, VOC_REDIS_URL
#
# COST (~$25/month):
#   api (basic-xxs):            $5
#   dashboard (basic-xxs):      $5
#   PostgreSQL (db-s-1vcpu-1gb): $15
# ═══════════════════════════════════════════════════════════
